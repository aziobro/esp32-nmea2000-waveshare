[env:waveshare-esp32s3-rs485-can]
board = esp32-s3-devkitm-1
; PlatformIO 6.1.19's git client can't resolve the upstream-pinned tag ref
; (fetches into FETCH_HEAD but then runs `git reset --hard <tag>` against a
; ref that was never created locally - reproduces on the stock upstream
; envs too, see doc/WaveshareRs485Can.md). PlatformIO resolves duplicate
; library names by FIRST occurrence, so appending an override after
; ${env.lib_deps} has no effect - the whole list has to be restated here
; with the NMEA2000 entry swapped for its resolved commit SHA. If upstream
; changes lib_deps in the root platformio.ini's [env]/[basedeps], mirror
; the non-NMEA2000 lines here too.
lib_deps =
	ttlappalainen_NMEA2000=https://github.com/wellenvogel/NMEA2000.git#bb5e2b31eb6066b1f82d3e0265f2b13154363ca5
	ttlappalainen/NMEA0183 @ 1.10.1
	ArduinoJson @ 6.18.5
	AsyncTCP-esphome @ 2.0.1
	ottowinter/ESPAsyncWebServer-esphome@2.0.1
	FS
	Preferences
	ESPmDNS
	WiFi
	Update
	fastled/FastLED @ 3.6.0
	Wire
	SPI
	h2zero/NimBLE-Arduino @ 2.5.1
; ESP32-S3R8 bare chip (8MB octal PSRAM) + external 16MB SPI flash (W25Q128JVSI),
; native USB Type-C wired directly to the S3's USB pins (no USB-UART bridge chip).
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; Not named config.json/index.js on purpose: those filenames get merged into
; EVERY environment's build automatically (see extra_script.py's
; createUserItemList), regardless of board - custom_config/custom_js instead
; only apply to whichever env references them, i.e. just this one.
custom_config =
	lib/icm20948task/icm20948Config.json
	lib/dst810task/dst810Config.json
	lib/calypsotask/calypsoConfig.json
custom_js =
	lib/icm20948task/icm20948.js
	lib/dst810task/dst810.js
build_flags =
	-D BOARD_WAVESHARE_ESP32S3_RS485_CAN
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	${env.build_flags}
upload_port = /dev/esp32s3
upload_protocol = esptool

; Same physical board, wired differently: a TTL<->RS422 transceiver on the
; Qwiic connector bridges a Garmin chartplotter's NMEA0183 port onto this
; device's NMEA2000 bus, instead of the ICM-20948 IMU. See the
; BOARD_WAVESHARE_ESP32S3_RS485_CAN_GARMIN block in
; GwWaveshare485CanTask.h for the pin/channel details - it uses the core's
; existing second-serial-channel mechanism (SERIAL2_CHANNEL_ID), so no new
; custom task/lib is needed here, and no custom_config/custom_js either
; (Serial2's baud/direction/toN2k fields are already part of the core's
; config schema and web UI).
[env:waveshare-esp32s3-rs485-can-garmin]
board = esp32-s3-devkitm-1
; Same core deps as the IMU env. lib/icm20948task/GwIcm20948Task.cpp still gets compiled into every env
; regardless of board (see extra_script.py's genereateUserTasks(), which
; globs ALL lib/*task* dirs unconditionally), but the IMU adapter is now
; direct-register code and has no external ICM-20948 library dependency.
lib_deps =
	ttlappalainen_NMEA2000=https://github.com/wellenvogel/NMEA2000.git#bb5e2b31eb6066b1f82d3e0265f2b13154363ca5
	ttlappalainen/NMEA0183 @ 1.10.1
	ArduinoJson @ 6.18.5
	AsyncTCP-esphome @ 2.0.1
	ottowinter/ESPAsyncWebServer-esphome@2.0.1
	FS
	Preferences
	ESPmDNS
	WiFi
	Update
	fastled/FastLED @ 3.6.0
	Wire
	SPI
	h2zero/NimBLE-Arduino @ 2.5.1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; lib/icm20948task/GwIcm20948Task.cpp and lib/dst810task/GwDst810Task.cpp
; (compiled into every env - see note above) reference
; GwConfigDefinitions::icmXXX/dst810XXX unconditionally, and those constants
; only exist if these config.json files are merged in for the env, even
; though the resulting fields are capability-gated ("icm20948"/"dst810")
; and so stay hidden on this board, which never advertises those
; capabilities.
custom_config =
	lib/icm20948task/icm20948Config.json
	lib/dst810task/dst810Config.json
	lib/calypsotask/calypsoConfig.json
; calypso.js is the one capability-gated web UI tab this env actually shows -
; the Calypso Ultrasonic wind sensor over BLE (lib/calypsotask), enabled via
; GWCALYPSO_ENABLE in this board's GwWaveshare485CanTask.h section.
custom_js =
	lib/calypsotask/calypso.js
build_flags =
	-D BOARD_WAVESHARE_ESP32S3_RS485_CAN_GARMIN
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	; the env name itself (34 chars) trips CASSERT(strlen(FIRMWARE_TYPE)<=31)
	; in src/main.cpp - GWBUILD_NAME overrides FIRMWARE_TYPE independently of
	; the (longer, more descriptive) PlatformIO env name, see GwAppInfo.h.
	-D GWBUILD_NAME=ws-garmin
	${env.build_flags}
upload_port = /dev/esp32s3
upload_protocol = esptool

; Same physical board again, wired differently still: a direct TTL UART
; connection (no RS422 transceiver this time) to an AIS unit's own UART,
; receive-only, 38400 baud. See BOARD_WAVESHARE_ESP32S3_RS485_CAN_AIS in
; GwWaveshare485CanTask.h - same core Serial2 mechanism as the Garmin
; bridge, no custom task needed for basic reception/verification.
;
; This board's own onboard RS485 port (UART1, separate from the AIS-unit
; TTL link above) is used by lib/eg4batterytask to passively sniff an EG4
; battery's Modbus RTU traffic with its inverter - see GWEG4BATTERY_ENABLE
; in GwWaveshare485CanTask.h.
[env:waveshare-esp32s3-rs485-can-ais]
board = esp32-s3-devkitm-1
lib_deps =
	ttlappalainen_NMEA2000=https://github.com/wellenvogel/NMEA2000.git#bb5e2b31eb6066b1f82d3e0265f2b13154363ca5
	ttlappalainen/NMEA0183 @ 1.10.1
	ArduinoJson @ 6.18.5
	AsyncTCP-esphome @ 2.0.1
	ottowinter/ESPAsyncWebServer-esphome@2.0.1
	FS
	Preferences
	ESPmDNS
	WiFi
	Update
	fastled/FastLED @ 3.6.0
	Wire
	SPI
	h2zero/NimBLE-Arduino @ 2.5.1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
custom_config =
	lib/icm20948task/icm20948Config.json
	lib/dst810task/dst810Config.json
	lib/calypsotask/calypsoConfig.json
	lib/eg4batterytask/eg4BatteryConfig.json
; eg4battery.js is the one capability-gated web UI tab this env actually
; shows - the EG4 battery RS485 Modbus sniffer (lib/eg4batterytask), enabled
; via GWEG4BATTERY_ENABLE in this board's GwWaveshare485CanTask.h section.
custom_js =
	lib/eg4batterytask/eg4battery.js
build_flags =
	-D BOARD_WAVESHARE_ESP32S3_RS485_CAN_AIS
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	${env.build_flags}
upload_port = /dev/esp32s3
upload_protocol = esptool
