; Desktop-testable math layer for the IMU heading pipeline lives in the
; SEPARATE lib/icm20948pure/ folder (not here), on purpose: this project's
; lib_ldf_mode=off (root platformio.ini's [env]) means every .cpp file
; directly under one lib/*/ folder compiles as a single unit for every real
; board env, and GwIcm20948Task.cpp here is Arduino/ICM_20948-dependent - if
; the pure math lived in this same folder, the native test env below would
; try (and fail) to compile GwIcm20948Task.cpp too. Keeping them in separate
; top-level lib/ folders means "including a pure-math header" only ever
; pulls in lib/icm20948pure as a compilation unit, never this one.
;
; Not in root platformio.ini's default_envs (opt-in only, via `pio test -e
; icm20948_native_test`) and root platformio.ini is itself untouched -
; picked up via its own `extra_configs = lib/*task*/platformio.ini` glob,
; the same mechanism the Waveshare board's own platformio.ini already uses.
[env:icm20948_native_test]
platform = native
; root platformio.ini's [env] also sets framework = arduino (requires a
; board) - override back to empty, same reasoning as extra_scripts above.
framework =
; Override the inherited lib_ldf_mode=off with proper dependency-chain
; discovery, scoped to just this env - combined with the explicit lib_deps
; below (pointing at ONLY lib/icm20948pure, relative to the project root,
; matching this project's existing root-relative path convention for
; custom_config/custom_js entries), this env only ever compiles the pure
; math library plus whatever test file pulls it in - it never touches
; lib/icm20948task or any other lib/*task* folder.
lib_ldf_mode = deep+
lib_deps = symlink://lib/icm20948pure
; root platformio.ini's [env] sets extra_scripts = pre:extra_script.py for
; every env (board-specific GwUserTasks.h/config generation) - that script
; assumes env["BOARD"] exists, which a native (non-board) env doesn't set.
; Override back to empty rather than touching root platformio.ini.
extra_scripts =
build_flags =
	-std=gnu++17
	-D UNITY_INCLUDE_DOUBLE
