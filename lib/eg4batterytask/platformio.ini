; Desktop-testable Modbus RTU sniffer core lives in the SEPARATE
; lib/modbussniffpure/ folder (not here), for the same reason
; lib/icm20948task/platformio.ini keeps lib/icm20948pure separate: this
; project's lib_ldf_mode=off (root platformio.ini's [env]) means every
; .cpp file directly under one lib/*/ folder compiles as a single unit for
; every real board env, and GwEg4BatteryTask.cpp here is Arduino-dependent -
; if the pure sniffer lived in this same folder, the native test env below
; would try (and fail) to compile it too.
;
; Not in root platformio.ini's default_envs (opt-in only, via `pio test -e
; eg4battery_native_test`) and root platformio.ini is itself untouched -
; picked up via its own `extra_configs = lib/*task*/platformio.ini` glob,
; same mechanism lib/icm20948task/platformio.ini and
; lib/waveshare485cantask/platformio.ini already use.
[env:eg4battery_native_test]
platform = native
; root platformio.ini's [env] also sets framework = arduino (requires a
; board) - override back to empty, same reasoning as extra_scripts below.
framework =
; Override the inherited lib_ldf_mode=off with proper dependency-chain
; discovery, scoped to just this env - combined with the explicit lib_deps
; below (pointing at ONLY lib/modbussniffpure), this env only ever compiles
; the pure sniffer library plus whatever test file pulls it in - it never
; touches lib/eg4batterytask or any other lib/*task* folder.
lib_ldf_mode = deep+
lib_deps =
	symlink://lib/modbussniffpure
; root platformio.ini's [env] sets extra_scripts = pre:extra_script.py for
; every env (board-specific GwUserTasks.h/config generation) - that script
; assumes env["BOARD"] exists, which a native (non-board) env doesn't set.
; Override back to empty rather than touching root platformio.ini.
extra_scripts =
build_flags =
	-std=gnu++17
